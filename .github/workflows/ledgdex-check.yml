# ledgdex check: made by "ledgdex workflow". Runs on every push, daily, and by hand.
# A failed run means a ledger was tampered with or rewritten; the report and proofs are attached to the run.
name: ledgdex check
on:
  push:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ledgdex @ git+https://github.com/matrixdex/ledgdex@main#subdirectory=py"
      - uses: actions/cache/restore@v6
        with:
          path: .ledgdex-check
          key: ledgdex-check-${{ github.run_id }}
          restore-keys: ledgdex-check-
      - run: ledgdex check seller/ledgdex.jsonl buyer/ledgdex.jsonl --json ledgdex-check.json
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ledgdex-check
          key: ledgdex-check-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ledgdex-check
          path: |
            ledgdex-check.json
            .ledgdex-check/proofs/
          if-no-files-found: ignore
