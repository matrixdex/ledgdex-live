# ledgdex check: made by "ledgdex workflow". Runs on every push, daily, and by hand.
# A failed run means a ledger was tampered with or rewritten; the report and proofs are attached to the run.
name: ledgdex check
on:
  push:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install "ledgdex @ git+https://github.com/matrixdex/ledgdex@v1.0.0#subdirectory=py"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .ledgdex-check
          key: ledgdex-check-${{ github.run_id }}
          restore-keys: ledgdex-check-
      - run: ledgdex check seller/ledgdex.jsonl buyer/ledgdex.jsonl --json ledgdex-check.json
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: always()
        with:
          path: .ledgdex-check
          key: ledgdex-check-${{ github.run_id }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: ledgdex-check
          path: |
            ledgdex-check.json
            .ledgdex-check/proofs/
          if-no-files-found: ignore
